    <!-- Main SaaS Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="logo-container">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="140" height="34" style="display: block;">
            <defs>
              <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4facfe" />
                <stop offset="100%" stop-color="#00f2fe" />
              </linearGradient>
              <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <g transform="translate(2, 2)">
              <path d="M 14 38 L 14 12 C 14 6.5, 19.5 2, 26 2 C 32.5 2, 38 6.5, 38 12 C 38 17.5, 32.5 23, 26 23 L 14 23" 
                    fill="none" 
                    stroke="url(#pulse-grad)" 
                    stroke-width="3" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    filter="url(#neon-glow)" />
              <path d="M 20 38 L 20 16 C 20 13, 22.5 10.5, 26 10.5 C 29.5 10.5, 32 13, 32 16 C 32 19, 29.5 21.5, 26 21.5 L 20 21.5" 
                    fill="none" 
                    stroke="url(#pulse-grad)" 
                    stroke-width="1.5" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                    opacity="0.8" />
              <path d="M 38 23 C 42 23, 44 4, 49 4 C 54 4, 56 42, 61 42 C 66 42, 68 10, 73 10 C 78 10, 80 34, 85 34 C 90 34, 92 18, 97 18 L 108 23" 
                    fill="none" 
                    stroke="url(#pulse-grad)" 
                    stroke-width="2.5" 
                    stroke-linecap="round"
                    filter="url(#neon-glow)" />
              <path d="M 38 23 C 42 23, 45 12, 49 12 C 53 12, 57 32, 61 32 C 66 32, 69 16, 73 16 C 77 16, 81 28, 85 28 L 95 23" 
                    fill="none" 
                    stroke="url(#pulse-grad)" 
                    stroke-width="1" 
                    stroke-linecap="round"
                    opacity="0.4" />
              <circle cx="49" cy="4" r="1.5" fill="#00f2fe" filter="url(#neon-glow)" />
              <circle cx="61" cy="42" r="1.2" fill="#00f2fe" />
              <circle cx="73" cy="10" r="1" fill="#00f2fe" />
            </g>
            <text x="115" y="32" fill="var(--text-primary)" font-family="var(--font-sans)" font-size="20" font-weight="900" letter-spacing="1">PULSE</text>
          </svg>
        </div>
        <span class="brand-divider">/</span>
        <span class="brand-subtitle">Plataforma Editorial</span>
      </div>

      <!-- Controls on Right -->
      <div class="header-widgets">
        <!-- Status Badges Group -->
        <div class="header-status-group">
          <div id="status-gemini" class="header-status-badge badge-loading" title="Servidor de IA">
            <span class="status-icon-indicator"></span>
            <span class="status-label">IA: Conectando...</span>
          </div>
          <div id="status-bsky" class="header-status-badge badge-loading" title="Bluesky">
            <span class="status-icon-indicator"></span>
            <span class="status-label">Bluesky</span>
          </div>
          <div id="status-twitter" class="header-status-badge badge-loading" title="Twitter / X">
            <span class="status-icon-indicator"></span>
            <span class="status-label">Twitter</span>
          </div>
          <div id="status-threads" class="header-status-badge badge-loading" title="Threads">
            <span class="status-icon-indicator"></span>
            <span class="status-label">Threads</span>
          </div>
        </div>

        <div class="header-sep"></div>

        <!-- Action Buttons -->
        <div class="header-actions-group">
          <button type="button" id="btn-theme-toggle" class="header-action-btn" title="Alternar tema claro/escuro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>

          <button type="button" id="btn-open-media-gallery-header" class="header-action-btn" title="Galeria de Mídias">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          </button>
        </div>

        <div class="header-sep"></div>

        <!-- User Info & Logout -->
        <div class="header-user-group" id="user-info-widget">
          <span id="header-user-email" class="header-user-email">...</span>
          <button type="button" id="btn-logout" class="btn-logout-clean" title="Encerrar sessão">Sair</button>
        </div>
      </div>
    </header>
